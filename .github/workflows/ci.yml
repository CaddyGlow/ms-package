name: Microsoft packages CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
concurrency:
  group: ${{ github.workflow }}-checks-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
permissions:
  contents: read
defaults:
  run:
    working-directory: ms-package
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: ms-package
      - name: Require pinned release dependencies
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          ARCHIVE_RS_REF: ${{ vars.ARCHIVE_RS_REF || 'main' }}
          CABINET_REF: ${{ vars.CABINET_REF || 'main' }}
          MS_COMPRESS_REF: ${{ vars.MS_COMPRESS_REF || 'main' }}
          WIM_RS_REF: ${{ vars.WIM_RS_REF || 'main' }}
          MKISO_RS_REF: ${{ vars.MKISO_RS_REF || 'main' }}
        run: python3 scripts/check-release-refs.py
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: validation
          workspaces: ms-package -> target
      - run: cargo fmt --all -- --check
      - run: cargo test --all-targets --all-features --locked
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo check --all-features --target wasm32-unknown-unknown --locked
      - run: cargo test --doc --locked
      - run: cargo test --doc --all-features --locked
      - run: cargo check --no-default-features --locked
      - run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: ms-package
      - name: Require pinned release dependencies
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          ARCHIVE_RS_REF: ${{ vars.ARCHIVE_RS_REF || 'main' }}
          CABINET_REF: ${{ vars.CABINET_REF || 'main' }}
          MS_COMPRESS_REF: ${{ vars.MS_COMPRESS_REF || 'main' }}
          WIM_RS_REF: ${{ vars.WIM_RS_REF || 'main' }}
          MKISO_RS_REF: ${{ vars.MKISO_RS_REF || 'main' }}
        run: python3 scripts/check-release-refs.py
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: validation
          workspaces: ms-package -> target
      - run: cargo test --all-targets --all-features --locked

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: ms-package
      - name: Require pinned release dependencies
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          ARCHIVE_RS_REF: ${{ vars.ARCHIVE_RS_REF || 'main' }}
          CABINET_REF: ${{ vars.CABINET_REF || 'main' }}
          MS_COMPRESS_REF: ${{ vars.MS_COMPRESS_REF || 'main' }}
          WIM_RS_REF: ${{ vars.WIM_RS_REF || 'main' }}
          MKISO_RS_REF: ${{ vars.MKISO_RS_REF || 'main' }}
        run: python3 scripts/check-release-refs.py
      - uses: actions/checkout@v7
        with:
          repository: CaddyGlow/caddy-archive
          ref: ${{ vars.ARCHIVE_RS_REF || 'main' }}
          path: archive-rs
      - uses: actions/checkout@v7
        with:
          repository: CaddyGlow/ms-cabinet
          ref: ${{ vars.CABINET_REF || 'main' }}
          path: cabinet
      - uses: actions/checkout@v7
        with:
          repository: CaddyGlow/ms-compress
          ref: ${{ vars.MS_COMPRESS_REF || 'main' }}
          path: ms-compress
      - uses: actions/checkout@v7
        with:
          repository: CaddyGlow/wim-rs
          ref: ${{ vars.WIM_RS_REF || 'main' }}
          path: wim-rs
      - uses: actions/checkout@v7
        with:
          repository: CaddyGlow/mkiso-rs
          ref: ${{ vars.MKISO_RS_REF || 'main' }}
          path: mkiso-rs
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - name: Reconcile sibling workspace dependencies
        # Integration must use this checkout, including across pre-1.0 minor bumps.
        run: |
          python3 scripts/authoring_workspace.py ../archive-rs
          cargo update --manifest-path ../archive-rs/Cargo.toml --workspace
      - name: Build browser bindings and parity fixtures
        working-directory: archive-rs
        run: |
          cargo build --release -p caddy-archive-wasm --features packages,crypto,sevenz,bzip2,brotli --target wasm32-unknown-unknown --locked
          wasm-bindgen target/wasm32-unknown-unknown/release/archive_wasm.wasm --target web --out-dir /tmp/archive-browser/pkg
          cargo run --manifest-path ../ms-package/Cargo.toml --example browser_fixtures --locked -- /tmp/archive-browser/pkg/fixtures
      - name: Run Chromium Worker checks
        working-directory: archive-rs
        env:
          ARCHIVE_BROWSER: google-chrome
        run: |
          node scripts/archive-browser-server.mjs &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node scripts/check-archive-browser.mjs
      - name: Run authoring Chromium Worker checks
        working-directory: ms-package
        env:
          ARCHIVE_BROWSER: google-chrome
        run: bash scripts/check-authoring-browser.sh ../archive-rs /tmp/archive-browser/pkg

  fuzz-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path fuzz/Cargo.toml -- --check
      - run: cargo clippy --manifest-path fuzz/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path fuzz/Cargo.toml --locked
