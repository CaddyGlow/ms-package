name: Microsoft packages Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to finalize from verified artifacts
        required: true
        type: string
      artifact_run_id:
        description: Release workflow run containing verified artifacts
        required: true
        type: string
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
defaults:
  run:
    working-directory: ms-package
jobs:
  validate:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  package:
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ms-package
    steps:
      - uses: actions/checkout@v7
        with:
          path: ms-package
      - name: Require pinned release dependencies
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          ARCHIVE_RS_REF: ${{ vars.ARCHIVE_RS_REF || 'main' }}
          CABINET_REF: ${{ vars.CABINET_REF || 'main' }}
          MS_COMPRESS_REF: ${{ vars.MS_COMPRESS_REF || 'main' }}
          WIM_RS_REF: ${{ vars.WIM_RS_REF || 'main' }}
          MKISO_RS_REF: ${{ vars.MKISO_RS_REF || 'main' }}
        run: python3 scripts/check-release-refs.py
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: validation
          workspaces: ms-package -> target
      - name: Check tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, tomllib
          with open("Cargo.toml", "rb") as manifest:
              data = tomllib.load(manifest)
          version = data.get("package", data.get("workspace", {}).get("package", {}))["version"]
          if os.environ["RELEASE_TAG"] != f"v{version}":
              raise SystemExit(f"Tag must match package version v{version}")
          PY
      - name: Package and verify offline sources
        run: |
          mkdir -p ../dist
          python3 scripts/source-release.py --output ../dist/ms-package-source.tar.gz
          python3 scripts/source-release.py --verify ../dist/ms-package-source.tar.gz
      - name: Build and verify crates.io packages
        run: cargo package --workspace --locked
      - uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: |
            dist/*source.tar.gz
            ms-package/target/package/*.crate
          if-no-files-found: error

  publish:
    name: Publish to crates.io
    needs: package
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          path: ms-package
      - uses: dtolnay/rust-toolchain@1.99.0
      - run: python3 scripts/publish-crates.py
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  github-release:
    needs: [package, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Publish source package and checksums
        working-directory: dist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PYFLAT'
          import pathlib, shutil
          root = pathlib.Path('.')
          for path in sorted(root.rglob('*')):
              if path.is_file() and (path.name.endswith('.crate') or path.name.endswith('.tar.gz')) and path.parent != root:
                  destination = root / path.name
                  if destination.exists():
                      raise SystemExit(f'Duplicate release asset: {path.name}')
                  shutil.move(path, destination)
          PYFLAT
          shopt -s nullglob
          files=(*.crate *.tar.gz)
          test "${#files[@]}" -gt 0
          sha256sum "${files[@]}" > SHA256SUMS
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" --verify-tag --notes-file ../CHANGELOG.md \
            "${flags[@]}" "${files[@]}" SHA256SUMS

  finalize-release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag }}
      - name: Verify artifacts belong to the requested tag
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ARTIFACT_RUN: ${{ inputs.artifact_run_id }}
        run: |
          test "$(gh api "repos/$GH_REPO/actions/runs/$ARTIFACT_RUN" --jq .head_sha)" = "$(git rev-parse HEAD)"
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
      - name: Finalize verified release assets
        working-directory: dist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python3 - <<'PYFLAT'
          import pathlib, shutil
          root = pathlib.Path('.')
          for path in sorted(root.rglob('*')):
              if path.is_file() and (path.name.endswith('.crate') or path.name.endswith('.tar.gz')) and path.parent != root:
                  destination = root / path.name
                  if destination.exists():
                      raise SystemExit(f'Duplicate release asset: {path.name}')
                  shutil.move(path, destination)
          PYFLAT
          shopt -s nullglob
          files=(*.crate *.tar.gz)
          test "${#files[@]}" -gt 0
          sha256sum "${files[@]}" > SHA256SUMS
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" --clobber "${files[@]}" SHA256SUMS
          else
            flags=()
            if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes "${flags[@]}" "${files[@]}" SHA256SUMS
          fi
