name: Microsoft packages Release
on:
  push:
    tags: ['v*']
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
defaults:
  run:
    working-directory: ms-package
jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  package:
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          path: ms-package
      - name: Require pinned release dependencies
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          ARCHIVE_RS_REF: ${{ vars.ARCHIVE_RS_REF || 'df3cb823c343f60b0a2a1ce70bac21a0f517fb14' }}
          CABINET_REF: ${{ vars.CABINET_REF || 'fb5c78b1bc07df078453aab484b2c8ce6fabb481' }}
          MS_COMPRESS_REF: ${{ vars.MS_COMPRESS_REF || '325015ce8c039287b42266f88157a7ec430867dd' }}
          WIM_RS_REF: ${{ vars.WIM_RS_REF || '541921ebda00790766ddb4b7fb8888fc1f3c1fbe' }}
          MKISO_RS_REF: ${{ vars.MKISO_RS_REF || '2ba7aa5ff6240040defe51447e09edb68b34ab59' }}
          WINDOWS_UUP_REF: ${{ vars.WINDOWS_UUP_REF || '67800fdf50d55cd7859715f477b4f858de2e3ae7' }}
        run: python3 scripts/check-release-refs.py
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.ARCHIVE_RS_REPOSITORY || format('{0}/archive-rs', github.repository_owner) }}
          ref: ${{ vars.ARCHIVE_RS_REF || 'df3cb823c343f60b0a2a1ce70bac21a0f517fb14' }}
          path: archive-rs
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.CABINET_REPOSITORY || format('{0}/cabinet', github.repository_owner) }}
          ref: ${{ vars.CABINET_REF || 'fb5c78b1bc07df078453aab484b2c8ce6fabb481' }}
          path: cabinet
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.MS_COMPRESS_REPOSITORY || format('{0}/ms-compress', github.repository_owner) }}
          ref: ${{ vars.MS_COMPRESS_REF || '325015ce8c039287b42266f88157a7ec430867dd' }}
          path: ms-compress
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.WIM_RS_REPOSITORY || format('{0}/wim-rs', github.repository_owner) }}
          ref: ${{ vars.WIM_RS_REF || '541921ebda00790766ddb4b7fb8888fc1f3c1fbe' }}
          path: wim-rs
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.MKISO_RS_REPOSITORY || format('{0}/mkiso-rs', github.repository_owner) }}
          ref: ${{ vars.MKISO_RS_REF || '2ba7aa5ff6240040defe51447e09edb68b34ab59' }}
          path: mkiso-rs
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.WINDOWS_UUP_REPOSITORY || format('{0}/windows-uup', github.repository_owner) }}
          ref: ${{ vars.WINDOWS_UUP_REF || '67800fdf50d55cd7859715f477b4f858de2e3ae7' }}
          path: windows-uup
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: validation
          workspaces: ms-package -> target
      - name: Check tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, tomllib
          with open("Cargo.toml", "rb") as manifest:
              data = tomllib.load(manifest)
          version = data.get("package", data.get("workspace", {}).get("package", {}))["version"]
          if os.environ["RELEASE_TAG"] != f"v{version}":
              raise SystemExit(f"Tag must match package version v{version}")
          PY
      - name: Package and verify offline sources
        run: |
          mkdir -p ../dist
          python3 scripts/source-release.py --output ../dist/ms-package-source.tar.gz
          python3 scripts/source-release.py --verify ../dist/ms-package-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: dist/*source.tar.gz
          if-no-files-found: error

  github-release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Publish source package and checksums
        working-directory: dist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          files=(*.crate *.tar.gz)
          test "${#files[@]}" -gt 0
          sha256sum "${files[@]}" > SHA256SUMS
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" --verify-tag --notes-file ../CHANGELOG.md \
            "${flags[@]}" "${files[@]}" SHA256SUMS
