name: Microsoft packages Release
on:
  push:
    tags: ['v*']
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
defaults:
  run:
    working-directory: ms-package
jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  package:
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ms-package
    steps:
      - uses: actions/checkout@v7
        with:
          path: ms-package
      - name: Require pinned release dependencies
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          ARCHIVE_RS_REF: ${{ vars.ARCHIVE_RS_REF || 'main' }}
          CABINET_REF: ${{ vars.CABINET_REF || 'main' }}
          MS_COMPRESS_REF: ${{ vars.MS_COMPRESS_REF || 'main' }}
          WIM_RS_REF: ${{ vars.WIM_RS_REF || 'main' }}
          MKISO_RS_REF: ${{ vars.MKISO_RS_REF || 'main' }}
        run: python3 scripts/check-release-refs.py
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.ARCHIVE_RS_REPOSITORY || format('{0}/caddy-archive', github.repository_owner) }}
          ref: ${{ vars.ARCHIVE_RS_REF || 'main' }}
          path: archive-rs
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.CABINET_REPOSITORY || format('{0}/ms-cabinet', github.repository_owner) }}
          ref: ${{ vars.CABINET_REF || 'main' }}
          path: cabinet
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.MS_COMPRESS_REPOSITORY || format('{0}/ms-compress', github.repository_owner) }}
          ref: ${{ vars.MS_COMPRESS_REF || 'main' }}
          path: ms-compress
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.WIM_RS_REPOSITORY || format('{0}/wim-rs', github.repository_owner) }}
          ref: ${{ vars.WIM_RS_REF || 'main' }}
          path: wim-rs
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.MKISO_RS_REPOSITORY || format('{0}/mkiso-rs', github.repository_owner) }}
          ref: ${{ vars.MKISO_RS_REF || 'main' }}
          path: mkiso-rs
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: validation
          workspaces: ms-package -> target
      - name: Check tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, tomllib
          with open("Cargo.toml", "rb") as manifest:
              data = tomllib.load(manifest)
          version = data.get("package", data.get("workspace", {}).get("package", {}))["version"]
          if os.environ["RELEASE_TAG"] != f"v{version}":
              raise SystemExit(f"Tag must match package version v{version}")
          PY
      - name: Package and verify offline sources
        run: |
          mkdir -p ../dist
          python3 scripts/source-release.py --output ../dist/ms-package-source.tar.gz
          python3 scripts/source-release.py --verify ../dist/ms-package-source.tar.gz
      - name: Build and verify crates.io packages
        run: cargo package --workspace --locked
      - uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: |
            dist/*source.tar.gz
            ms-package/target/package/*.crate
          if-no-files-found: error

  publish:
    name: Publish to crates.io
    needs: package
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          path: ms-package
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.ARCHIVE_RS_REPOSITORY || format('{0}/caddy-archive', github.repository_owner) }}
          ref: ${{ vars.ARCHIVE_RS_REF || 'main' }}
          path: archive-rs
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.CABINET_REPOSITORY || format('{0}/ms-cabinet', github.repository_owner) }}
          ref: ${{ vars.CABINET_REF || 'main' }}
          path: cabinet
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.MS_COMPRESS_REPOSITORY || format('{0}/ms-compress', github.repository_owner) }}
          ref: ${{ vars.MS_COMPRESS_REF || 'main' }}
          path: ms-compress
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.WIM_RS_REPOSITORY || format('{0}/wim-rs', github.repository_owner) }}
          ref: ${{ vars.WIM_RS_REF || 'main' }}
          path: wim-rs
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.MKISO_RS_REPOSITORY || format('{0}/mkiso-rs', github.repository_owner) }}
          ref: ${{ vars.MKISO_RS_REF || 'main' }}
          path: mkiso-rs
      - uses: dtolnay/rust-toolchain@1.99.0
      - run: python3 scripts/publish-crates.py
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  github-release:
    needs: [package, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Publish source package and checksums
        working-directory: dist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          files=(*.crate *.tar.gz)
          test "${#files[@]}" -gt 0
          sha256sum "${files[@]}" > SHA256SUMS
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" --verify-tag --notes-file ../CHANGELOG.md \
            "${flags[@]}" "${files[@]}" SHA256SUMS
