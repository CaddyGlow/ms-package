[package]
name = "ms-package"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
repository = "https://github.com/CaddyGlow/ms-package"
homepage = "https://github.com/CaddyGlow/ms-package"
documentation = "https://github.com/CaddyGlow/ms-package/blob/main/README.md"
readme = "README.md"
keywords = ["msix", "appx", "msi", "windows", "archive"]
categories = ["parser-implementations", "compression"]
publish = false
license = "MIT"
description = "Portable read-only Windows package inspection and payload validation"

[dependencies]
cfb = "0.14"
archive-core = { path = "../archive-rs/crates/archive-core" }
msi = { package = "caddy-msi", version = "=0.10.0" }
quick-xml = "0.38"
sha2 = "0.10"
base64 = "0.22"
thiserror = "2"

[dev-dependencies]
zip = { version = "2.4", default-features = false }
cabinet = { path = "../cabinet" }
serde_json = "1"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace]
resolver = "3"
